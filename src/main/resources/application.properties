spring.application.name=checkout-api
server.port=${PORT:8081}
server.max-http-request-header-size=8KB

# Evita vazamento de stack traces e mensagens internas pelo BasicErrorController
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Configuração do Banco de Dados (H2 em memória localmente; Neon PostgreSQL via SPRING_DATASOURCE_URL em produção)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:checkoutdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=20000

# Console Web do H2 desabilitado por padrão em produção (habilite apenas em dev via H2_CONSOLE_ENABLED=true)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Configuração do JPA / Hibernate (open-in-view desabilitado por boas práticas em APIs REST)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Springdoc OpenAPI desabilitado por padrão em produção (habilite via SWAGGER_ENABLED=true)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Segurança, Rate Limit e Retenção de Pedidos em Memória (H2)
app.security.internal-api-key=${INTERNAL_API_KEY:}
app.security.max-json-body-bytes=${MAX_JSON_BODY_BYTES:65536}
app.security.trust-proxy-headers=${TRUST_PROXY_HEADERS:false}
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.write-requests-per-minute=${RATE_LIMIT_WRITE_RPM:30}
app.security.rate-limit.read-requests-per-minute=${RATE_LIMIT_READ_RPM:120}

app.orders.retention-hours=${ORDERS_RETENTION_HOURS:24}
app.orders.cleanup-interval-ms=${ORDERS_CLEANUP_INTERVAL_MS:3600000}
app.orders.max-stored-orders=${MAX_STORED_ORDERS:2000}
app.orders.max-list-results=${MAX_LIST_RESULTS:100}
